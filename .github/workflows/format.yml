name: Format Files
run-name: Format files using Oxfmt
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup github-actions[bot] git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@22
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format files
        run: pnpm run format
      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes_exist=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "changes_exist=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Output if changes exist
        env:
          CHANGES_EXIST: ${{ steps.changes.outputs.changes_exist }}
        run: echo "$CHANGES_EXIST"
      - name: Commit formatting changes via GitHub Actions, if changes exist
        if: steps.changes.outputs.changes_exist == 'true'
        run: |-
          git commit -m "chore: format files via github actions"
          git push
