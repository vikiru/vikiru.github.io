commit-msg:
  jobs:
    - name: Validate commit message with commitlint
      run: pnpm exec commitlint --edit $1

pre-commit:
  parallel: false
  jobs:
    - name: Format staged files with oxfmt
      glob: '*.{js,mjs,cjs,ts,jsx,tsx,json,css}'
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: Lint staged files with oxlint
      glob: '*.{js,mjs,cjs,ts,jsx,tsx}'
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}

pre-push:
  jobs:
    - name: TypeScript verification
      run: pnpm typecheck
